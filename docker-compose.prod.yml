services:
  postgres:
    image: postgres:16-alpine
    container_name: travel_postgres_prod
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_prod_data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-3026}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: travel_backend_prod
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      - APP_NAME=Travel Manager
      - APP_ENV=production
      - APP_SECRET_KEY=${APP_SECRET_KEY}
      - DATABASE_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      - UPLOAD_DIR=/app/uploads
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - GOOGLE_MAPS_API_KEY=${GOOGLE_MAPS_API_KEY:-}
      - WEATHER_API_KEY=${WEATHER_API_KEY:-}
      - SMTP_HOST=${SMTP_HOST:-}
      - SMTP_PORT=${SMTP_PORT:-587}
      - SMTP_USER=${SMTP_USER:-}
      - SMTP_PASSWORD=${SMTP_PASSWORD:-}
      - EMAILS_FROM_EMAIL=${EMAILS_FROM_EMAIL:-}
    volumes:
      - travel_prod_uploads:/app/uploads
      - travel_prod_backups:/app/backups
    ports:
      - "127.0.0.1:${BACKEND_PORT:-3025}:8000"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: travel_frontend_prod
    restart: always
    depends_on:
      - backend
    ports:
      - "127.0.0.1:${FRONTEND_PORT:-3024}:80"

volumes:
  postgres_prod_data:
    name: travel_postgres_prod_data
  travel_prod_uploads:
    name: travel_prod_uploads_data
  travel_prod_backups:
    name: travel_prod_backups_data
