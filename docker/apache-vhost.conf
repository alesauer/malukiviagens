# ==============================================================================
# Configuração do Apache VirtualHost para Maluki Viagens
# Salve este arquivo em: /etc/apache2/sites-available/maluki.conf (no Ubuntu/Debian)
# Ative com: sudo a2enmod proxy proxy_http proxy_wstunnel headers rewrite ssl
#            sudo a2ensite maluki.conf
#            sudo systemctl reload apache2
# ==============================================================================

<VirtualHost *:80>
    ServerName viagens.seudominio.com
    ServerAdmin admin@seudominio.com

    # Redireciona HTTP para HTTPS automaticamente
    RewriteEngine On
    RewriteCond %{HTTPS} off
    RewriteRule ^ https://%{HTTP_HOST}%{REQUEST_URI} [L,R=301]

    ErrorLog ${APACHE_LOG_DIR}/maluki_error.log
    CustomLog ${APACHE_LOG_DIR}/maluki_access.log combined
</VirtualHost>

<VirtualHost *:443>
    ServerName viagens.seudominio.com
    ServerAdmin admin@seudominio.com

    SSLEngine on
    # Certificados SSL (gerenciados pelo Certbot / Let's Encrypt)
    # Execute: sudo certbot --apache -d viagens.seudominio.com
    # SSLCertificateFile /etc/letsencrypt/live/viagens.seudominio.com/fullchain.pem
    # SSLCertificateKeyFile /etc/letsencrypt/live/viagens.seudominio.com/privkey.pem

    ProxyPreserveHost On
    ProxyRequests Off

    # Headers recomendados para encaminhamento seguro
    RequestHeader set X-Forwarded-Proto "https"
    RequestHeader set X-Forwarded-Port "443"

    # 1. Rotas de API Supabase -> Kong Gateway (porta local 8000)
    ProxyPass /auth/v1/ http://127.0.0.1:8000/auth/v1/
    ProxyPassReverse /auth/v1/ http://127.0.0.1:8000/auth/v1/

    ProxyPass /rest/v1/ http://127.0.0.1:8000/rest/v1/
    ProxyPassReverse /rest/v1/ http://127.0.0.1:8000/rest/v1/

    ProxyPass /storage/v1/ http://127.0.0.1:8000/storage/v1/
    ProxyPassReverse /storage/v1/ http://127.0.0.1:8000/storage/v1/

    # 2. Suporte a WebSockets (se aplicável)
    RewriteEngine On
    RewriteCond %{HTTP:Upgrade} websocket [NC]
    RewriteCond %{HTTP:Connection} upgrade [NC]
    RewriteRule ^/?(.*) "ws://127.0.0.1:3000/$1" [P,L]

    # 3. Frontend & SSR TanStack Start -> App Container (porta local 3000)
    ProxyPass / http://127.0.0.1:3000/
    ProxyPassReverse / http://127.0.0.1:3000/

    ErrorLog ${APACHE_LOG_DIR}/maluki_ssl_error.log
    CustomLog ${APACHE_LOG_DIR}/maluki_ssl_access.log combined
</VirtualHost>

